<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style1.css">
  <script src="script/script1.js" defer></script>
  <link rel="icon" href="imgs/coracao.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eu Te Amo</title>
</head>

<body>
  <div class="container">

    <div class="title">
      <h1 class="title_text">OIIII, AMOR!!</h1>
      <h2 class="title_subtext">Esse foi o cantinho que eu fiz pra você! Espero que goste</h2>
    </div>

    <div class="lifeCounter">

      <h3 class="lifeCounter_text">Já fazem...</h3>

      <table class="lifeCounter_table">
        <tr class="lifeCounter_table_titles">
          <th>Anos</th>
          <th>Meses</th>
          <th>Semana</th>
          <th>Dias</th>
          <th>Horas</th>
          <th>Minutos</th>
          <th>Segundos</th>
        </tr>

        <tr class="lifeCounter_table_calculate">

        </tr>
      </table>

      <h3>... Desde que você nasceu, meu amor!</h3>

      <div class="mural">

        <!-- MURAL ANTES -->
        <img src="/imgs/Mural do Meu Amor def.png" class="mural_img active" id="muralAntes">

        <!-- MURAL DEPOIS -->
        <img src="/imgs/Mural do Meu Amor depois.png" class="mural_img" id="muralDepois">

        <!-- BOTÃO CORAÇÃO -->
        <img src="/imgs/coracao.png" class="btn_coracao" id="btnCoracao">

      </div>

      <div class="timeline">

        <h2>Agora olha literalmente literalmente você:</h2>

        <!-- ANO -->
        <h1 class="timeline_year" id="timelineYear">
          2023
        </h1>

        <!-- CARROSSEL -->
        <div class="carousel">

          <button class="carousel_btn" id="prevBtn">
            ❮
          </button>

          <img src="/imgs/2023.jpg" class="carousel_img" id="carouselImg">

          <button class="carousel_btn" id="nextBtn">
            ❯
          </button>

        </div>

      </div>

    </div>
</body>

</html>
